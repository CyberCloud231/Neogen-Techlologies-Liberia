<div class="row g-5"><div class="col-lg-8"><h2>{{product.name}} Overview</h2><p class="lead">{{product.longDesc}}</p><div class="d-flex gap-2 flex-wrap mt-3"><span *ngFor="let p of product.platforms" class="plat-badge">{{p}}</span></div><ul class="mt-4"><li *ngFor="let b of product.benefits"><i class="bi bi-check-circle-fill text-success"></i> {{b}}</li></ul></div><div class="col-lg-4"><div class="info-card"><h5>Built for Liberia</h5><p>LBR NO: LR204069</p></div><img *ngFor="let s of product.screenshots" [src]="s" class="img-fluid rounded mt-3 shadow-sm"/></div></div>
