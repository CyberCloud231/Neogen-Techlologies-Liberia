<div class="row g-5"><div class="col-lg-6"><h2>Apply for {{product.name}}</h2><p>Self-register and get license in 5 minutes.</p></div><div class="col-lg-6"><form (ngSubmit)="submit()" class="signup-box"><input class="form-control mb-2" placeholder="Full Name" [(ngModel)]="form.name" name="name" required><input class="form-control mb-2" placeholder="Email" [(ngModel)]="form.email" name="email" required><input class="form-control mb-2" placeholder="Company" [(ngModel)]="form.company" name="company"><input class="form-control mb-3" placeholder="Phone" [(ngModel)]="form.phone" name="phone"><button class="btn-royal w-100">Register for {{product.name}}</button></form></div></div>
