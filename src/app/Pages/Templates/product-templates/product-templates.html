<div *ngIf="product" class="product-onepage">
  <!-- HERO + SUBNAV INSIDE HOVER IMAGE -->
  <app-product-hero
    [product]="product"
    [productName]="product.name"
    [tabs]="tabs"
    [activeTab]="activeTab"
    (tabChange)="scrollTo($event)">
  </app-product-hero>

  <!-- ONE PAGE SECTIONS - ALL VISIBLE -->
  <app-product-overview [product]="product"></app-product-overview>
  <app-product-features [features]="product.features" [productName]="product.name"></app-product-features>
  <app-product-pricing [pricing]="product.pricing" [productName]="product.name"></app-product-pricing>
  <app-product-downloads [downloads]="product.downloads" [productName]="product.name"></app-product-downloads>
  <app-product-signup [product]="product"></app-product-signup>
</div>

<div *ngIf="!product" class="container py-5 text-center">
  <div class="spinner-border text-primary"></div>
  <h4 class="mt-3">Loading {{ activeTab }}...</h4>
</div>
