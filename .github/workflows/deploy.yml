name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04   # safer than ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4   # upgrade to v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'   # use Node.js 22 (stable)

      - name: Install dependencies
        run: npm ci   # faster & more reliable than npm install

      - name: Build Angular
        run: npm run build -- --output-path docs --base-href ./

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs

